[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ff-explorer"
version = "1.0.0"
description = "Files/Folders Explorer: recursively list, save, remove, or compress entries matching a name seed."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Juan García Sánchez", email = "juangarciasanchez96@gmail.com" }]
requires-python = ">=3.11"
# NOTE: Build/CI ceiling is Python 3.13.
# FastMCP 3.4.2 declares support only through 3.13 (see docs/research-unit-converter.md L1/Q5).
# The runtime floor is 3.11 (guarantees stdlib tomllib; no version-sensitive syntax below 3.13).

dependencies = [
    # Recycle-bin / OS-trash route for destructive removes (R-1 safety hardening).
    # Audited pin: send2trash 2.1.0 is the current stable release (2026-06-11);
    # requires-python >=3.8; declared support 3.8–3.14.
    "send2trash>=2.1.0,<3",
    # PySide6 6.11.1 — primary GUI toolkit (replaces Tkinter).
    # LGPLv3, compatible with repo GPL-3.0.
    # See docs/research-unit-converter.md F3.2 for LGPL compliance notes.
    "PySide6~=6.11.1",
]

[project.optional-dependencies]
api = [
    # Dual MCP + REST access layer (WS-3, handled by access-layer-builder).
    "fastmcp>=3.4,<4",
    "fastapi>=0.136,<1",
    "uvicorn>=0.49,<1",
]
dev = [
    "pytest~=9.0.3",
    "pytest-cov~=7.1.0",
    "pyinstaller~=6.20.0",
]

[project.scripts]
# Access-layer entry points (WS-3 — generated by access-layer-builder).
# Requires: pip install "ff-explorer[api]"
# REST + MCP Streamable HTTP server (uvicorn):
ff-explorer-api = "ff_explorer.api.main:run_server"
# MCP stdio transport (for CLI/agent clients):
ff-explorer-mcp = "ff_explorer.api.mcp_server:run_stdio"

[project.gui-scripts]
# Primary Qt GUI entry point (WS-2 PySide6 migration).
# gui-scripts suppresses the console window on Windows (equivalent to .pyw).
ff-explorer-gui = "ff_explorer.gui.app:main"


[tool.hatch.build.targets.wheel]
packages = ["ff_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ff_explorer --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["ff_explorer"]
omit = [
    # Package init — version shim only, no domain logic.
    "ff_explorer/__init__.py",
    # GUI package — requires a live Qt/PySide6 display server; all logic under
    # test lives in core.py and the API layer. Excluded from the coverage gate
    # per the campaign rule: focus coverage on the core (headless-testable code).
    "ff_explorer/gui/*",
    # Server bootstrap — module-level and stdio entry points are pragma: no cover
    # already; they cannot be exercised without spawning a full uvicorn process.
    "ff_explorer/api/main.py",
]
